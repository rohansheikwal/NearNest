{% extends 'base.html' %}
{% block title %}Delete Service — Neighborly{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card">
        <div class="card-body p-4 text-center">
          <div style="width:56px;height:56px;border-radius:50%;background:#FEE2E2;color:#DC2626;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </div>
          <h1 style="font-size:1.2rem;font-weight:800;margin-bottom:0.5rem;">Delete Service?</h1>
          <p class="text-muted" style="font-size:0.9rem;margin-bottom:1.5rem;">
            Are you sure you want to permanently delete <strong>"{{ service.title }}"</strong>? This action cannot be undone.
          </p>
          <form method="POST" class="d-flex gap-3 justify-content-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'services:provider_dashboard' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
