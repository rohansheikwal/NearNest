{% extends 'base.html' %}
{% block title %}Access Denied — Neighborly{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:4rem 1rem;">
  <div class="text-center">
    <div style="font-size:6rem;font-weight:900;color:var(--color-border);line-height:1;font-family:var(--font-main);">403</div>
    <h1 style="font-size:1.5rem;font-weight:800;margin:1rem 0 0.5rem;">Access Denied</h1>
    <p class="text-muted" style="max-width:400px;margin:0 auto 2rem;">You don't have permission to view this page. Please log in with the correct account type.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary">Go to Homepage</a>
  </div>
</div>
{% endblock %}
