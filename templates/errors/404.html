{% extends 'base.html' %}
{% block title %}Page Not Found — Neighborly{% endblock %}
{% block content %}
<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:4rem 1rem;">
  <div class="text-center">
    <div style="font-size:6rem;font-weight:900;color:var(--color-border);line-height:1;font-family:var(--font-main);">404</div>
    <h1 style="font-size:1.5rem;font-weight:800;margin:1rem 0 0.5rem;">Page Not Found</h1>
    <p class="text-muted" style="max-width:400px;margin:0 auto 2rem;">
      The page you're looking for doesn't exist, or may have been moved. Let's get you back on track.
    </p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{% url 'core:home' %}" class="btn btn-primary">Go to Homepage</a>
      <a href="{% url 'services:service_list' %}" class="btn btn-secondary">Browse Services</a>
    </div>
  </div>
</div>
{% endblock %}
