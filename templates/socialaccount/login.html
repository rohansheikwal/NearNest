{% extends 'base.html' %}

{% block title %}Continue with Google — NearNest{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="container">
    <div class="auth-card text-center">
      <h1 class="auth-title">Continue with Google</h1>
      <p class="auth-subtitle">
        You are about to sign in to NearNest using your Google account.
      </p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3 d-flex align-items-center justify-content-center text-center">
          Continue with Google
        </button>
      </form>

      <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary w-100 mt-3 d-flex align-items-center justify-content-center text-center">
        Cancel
      </a>
    </div>
  </div>
</div>
{% endblock %}
