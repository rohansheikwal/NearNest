{% extends 'base.html' %}

{% block title %}Password Updated — NearNest{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="container">
    <div class="auth-card text-center">
      <div class="mb-3">
        <div style="width:64px;height:64px;border-radius:50%;background:#EBF3ED;color:#234C3A;display:inline-flex;align-items:center;justify-content:center;margin-bottom:0.75rem;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
      </div>
      <h1 class="auth-title">Password Reset Complete!</h1>
      <p class="auth-subtitle mb-4">
        Your password has been changed successfully. You can now use your new password to sign in to your NearNest account.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100" style="padding:0.75rem 1.5rem;font-weight:600;">
        Sign In to Your Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
